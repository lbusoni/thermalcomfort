[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermalcomfort"
version = "0.1.0"
description = "Outdoor thermal comfort analysis and visualization toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "lbusoni" }
]
dependencies = [
  "pythermalcomfort>=4.0",
  "pvlib>=0.10",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "requests>=2.28",
  "matplotlib>=3.7",
  "folium>=0.20",
  "ipywidgets>=8.0",
  "ipympl>=0.9",
  "nbformat>=5.0",
  "timezonefinder>=6.0",
]

[project.scripts]
thermalcomfort = "thermalcomfort.__main__:main"

[tool.setuptools]
packages = ["thermalcomfort", "thermalcomfort.providers", "thermalcomfort.comfort"]
